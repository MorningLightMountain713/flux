# The topics this daemon publishes. FluxOS reads exactly these keys to decide, per topic,
# whether to take the push path or to poll (daemonSubscriptionService.isTopicAvailable).
# The address a node dials comes from its own config, not from here; the address below is
# where the publisher binds, which is every interface of the daemon stub container.
#
# The runner renders this file per suite before mounting it (runner/framework/fluxd-conf.js),
# so a node reads this set unless createTestEnv({ zmqTopics }) asked for another one. That is
# also where the reason fluxnodestatus is not in the default set is written down.
zmqpubhashblock=tcp://0.0.0.0:16123
zmqpubhashblockheight=tcp://0.0.0.0:16123
zmqpubchainreorg=tcp://0.0.0.0:16123
zmqpubfluxnodelistdelta=tcp://0.0.0.0:16123
